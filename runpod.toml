# RunPod Serverless Configuration
# This file tells RunPod how to build and run the worker

[project]
name = "klantenservice-personaplex"
base_image = "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
gpu_types = ["NVIDIA A40", "NVIDIA A100-SXM4-40GB", "NVIDIA A100 80GB PCIe", "NVIDIA RTX A6000"]
volume_mount_path = "/runpod-volume"

[runtime]
python_version = "3.11"
handler_path = "handler.py"

[build]
system_packages = ["ffmpeg", "libsndfile1"]
python_packages = [
    "runpod>=1.6.0",
    "torch>=2.4.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "numpy",
    "scipy",
    "soundfile",
    "librosa"
]

[env]
PYTHONUNBUFFERED = "1"
TRANSFORMERS_CACHE = "/runpod-volume/cache/huggingface"
HF_HOME = "/runpod-volume/cache/huggingface"
